[ConsoleVariables]
; Meta XR Simulator (UE5.7) hard-crashes at OpenXRHMD.cpp:2765
;   check(MotionVectorIndex == MotionVectorDepthIndex)
; because the simulator returns mismatched FB_space_warp / frame-synthesis swapchain indices.
; The motion-vector swapchains are only allocated when StereoMotionVectors is set, which happens
; only when xr.OpenXRFrameSynthesis is enabled AND the runtime advertises the extension
; (OpenXRHMD.cpp:1374-1385). Turning frame synthesis OFF means the swapchains are never created,
; so the assert is never reached. Application SpaceWarp/ASW is a perf-only feature — safe to leave
; off for this experiment, both in the simulator and on the Quest 3.
xr.OpenXRFrameSynthesis=0
; Second Meta XR Simulator swapchain bug: "Array index out of bounds: 577 into an array of size 3"
; in OpenXRHMD.dll. The simulator's xrAcquireSwapchainImage returns a garbage image index, which UE
; then uses to index its 3-image swapchain array (AcquireColorTexture/AcquireDepthTexture). AcquireMode=1
; forces UE to track the swapchain index itself (manual 0->1->2 increment) instead of trusting the
; runtime's index. AllowDepthLayer=0 drops the depth swapchain entirely (depth compositing was already
; off via bCompositesDepth), removing the AcquireDepthTexture path the OOB was hitting.
xr.OpenXRAcquireMode=1
xr.OpenXRAllowDepthLayer=0

